<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Card Store</title>
    <script src="cardcollector.js" type="application/javascript"></script>
</head>
<body onload="loadCards()">
    <table id='cardOptions'>
        <tr>
            <td>
                <input type="checkbox" id="raresOnly" name="raresOnly" value="rarersOnly" onclick="loadCards()">
                <label for="rarersOnly">Show Rare Cards Only</label>
            </td>

            <td>
                 <input type="checkbox" id="currency" name="currency" value="currency" onclick="loadCards()">
                <label for="currency">Show Prices in EU</label>

            </td>
        </tr>
    </table>

    <table id="myCards" border="1" width="75%">

    </table>

</body>
</html>
